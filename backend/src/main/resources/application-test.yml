spring:
  datasource:
    url: jdbc:h2:mem:itauinvest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: dGVzdFNlY3JldEtleUZvckl0YXVJbnZlc3RKVW5pdFRlc3RzMjAyNFNlY3VyZUtleQ==
      expiration-ms: 3600000
      issuer: itau-invest-test
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.itau.invest: INFO
